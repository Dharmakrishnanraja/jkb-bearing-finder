  <div class="col gap10">${carryForwardMembers.length ? carryForwardMembers.map((m,mi)=>`<div class="card pad section-card section-tone-${(mi%7)+1}"><div class="row-between"><div><div style="font-weight:800;font-size:13px;">${esc(m.fullName)}</div><div style="font-size:11px;color:var(--warn);font-weight:700;">⚠️ Banked: ${fmtMoney(m.carryForwardRD)}</div></div><button class="btn btn-sm btn-primary" ${m.carryForwardRD < (db.settings.contributionAmount||3000) ? 'disabled' : ''} onclick="forceReleaseCarryForward('${m.id}');render();">Force to Pre-RD</button></div></div>`).join("") : `<div class="empty-state">No carried-forward balances.</div>`}</div>`;
}

function toggleSelectContrib(memberId, entryId){
  const key = `${memberId}:${entryId}`;
  if(!Array.isArray(S.selectedContribs)) S.selectedContribs = [];
  const idx = S.selectedContribs.indexOf(key);
  if(idx >= 0) S.selectedContribs.splice(idx,1); else S.selectedContribs.push(key);
  render();
}
function toggleSelectAllContribs(keys, checked){
  S.selectedContribs = checked ? keys.slice() : [];
  render();
}
function bulkApproveContributions(){
  const selected = (S.selectedContribs||[]).slice();
  if(selected.length===0) return;
  selected.forEach(key=>{
    const [memberId, entryIdStr] = key.split(":");
    processApprovedContribution(memberId, parseInt(entryIdStr,10), true); // skip each individual save — race-condition safe
  });
  saveState(db); // ONE save, after all items are fully processed, with the complete final state
  logActivity("Bulk Approval", `${selected.length} monthly contribution(s) approved in bulk`);
  S.selectedContribs = [];
  showToast(`${selected.length} contribution(s) approved!`);
  render();
}

/* ============== LEVEL MATRIX REPORT ============== 29.08.2026 */
function getLevelStats(rootId, maxLevel = 15) {
  const stats = [];
  let currentLevelMembers = [findMember(rootId)];
  let cumulativeJoined = 0;
  
  for (let level = 0; level <= maxLevel; level++) {
    const expected = Math.pow(2, level);
    const joined = currentLevelMembers.filter(m => m).length;
    const empty = expected - joined;
    cumulativeJoined += joined;
    
    // ✅ FIXED: Count how many in THIS level are Left Legs vs Right Legs
    let leftCount = 0, rightCount = 0;
    currentLevelMembers.forEach(m => {
      if (m) {
        if (m.position === "Left") leftCount++;
        else if (m.position === "Right") rightCount++;
      }
    });
    
    // Prepare next level members
    const nextLevelMembers = [];
    currentLevelMembers.forEach(m => {
      if (m) {
        nextLevelMembers.push(m.leftChild ? findMember(m.leftChild) : null);
        nextLevelMembers.push(m.rightChild ? findMember(m.rightChild) : null);
      } else {
        nextLevelMembers.push(null); nextLevelMembers.push(null);
      }
    });
    
    stats.push({ level, expected, joined, empty, cumulativeJoined, leftCount, rightCount });
    currentLevelMembers = nextLevelMembers;
    if (joined === 0 && level > 0) break;
  }
  return stats;
}

  doc.text("Left Joined", 85, 33); doc.text("Right Joined", 115, 33); doc.text("Total Joined", 145, 33); 
  doc.text("Empty", 175, 33); doc.text("Cumulative", 200, 33);

        S.treeHistory.push(S.focusRootId);
      }
      S.focusRootId = link.dataset.nodeId;
      render();
    } 
    // If it's an empty "Add Member" slot
    else if(link.dataset.addSponsor){
      openRegisterForm(link.dataset.addSponsor, link.dataset.addPos);
    }
  });
  
  // Tooltip logic
  const tooltip = document.getElementById('tree-tooltip');
  if(!tooltip) return;
  
  treeRoot.addEventListener('mouseover', function(e){
    const link = e.target.closest('a');
    if(link && link.dataset.tip){
      tooltip.textContent = link.dataset.tip;
      tooltip.classList.add('show');
      positionTooltip(link, tooltip);
    }
  });
  
  treeRoot.addEventListener('mouseout', function(e){
    const link = e.target.closest('a');
    if(link && link.dataset.tip){
      tooltip.classList.remove('show');
    }
  });
}

function positionTooltip(target, tooltip){
  const rect = target.getBoundingClientRect();
  const scrollTop = window.scrollY || document.documentElement.scrollTop;
  const scrollLeft = window.scrollX || document.documentElement.scrollLeft;
  const top = rect.top + scrollTop - tooltip.offsetHeight - 10;
  const left = rect.left + scrollLeft + (rect.width / 2) - (tooltip.offsetWidth / 2);
  tooltip.style.top = Math.max(4, top) + 'px';
  tooltip.style.left = Math.max(4, left) + 'px';
}

/* Auth state restore */
let pendingAuthEmail;
window.addEventListener("fb-authchanged", (e)=>{
  pendingAuthEmail = e.detail.email;
  applyAuthState();
});
function applyAuthState(){
  if(!db || pendingAuthEmail === undefined) return;
  if(!pendingAuthEmail){
    if(S.currentUserId){ S.currentUserId = null; render(); }
    return;
  }
  const idFromEmail = pendingAuthEmail.split("@")[0].toUpperCase();
  const m = findMember(idFromEmail);
  if(m && S.currentUserId !== m.id){
    S.currentUserId = m.id;
    S.loginRole = m.role === "admin" ? "admin" : "member";
    S.focusRootId = m.id;
    render();
  }
}

function boot(){ initApp().then(applyAuthState); }
if(window.FB && window.FB.ready){ boot(); }
else{ window.addEventListener("fb-ready", boot, {once:true}); }
</script>
